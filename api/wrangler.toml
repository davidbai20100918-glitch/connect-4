name = "connect4-comments"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No dependencies: the Worker uses the built-in WebCrypto API, so this can
# also be pasted straight into the Cloudflare dashboard editor.

[vars]
# Comma separated. For local dev add e.g. ,http://localhost:8788
ALLOWED_ORIGINS = "https://davidbai20100918-glitch.github.io"
# GOOGLE_CLIENT_ID is a public value (it is also in comment-section.js).
# Set it here or with: npx wrangler secret put GOOGLE_CLIENT_ID
#
# SESSION_SECRET must be a secret:
#   npx wrangler secret put SESSION_SECRET

[[d1_databases]]
binding = "DB"
database_name = "connect4-comments"
database_id = "805d1d20-2ab6-4aa8-8220-90cb003512fc"

[observability]
enabled = true
